<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Studi Kasus Pembelajaran Web</title>
    <style>
        /* Mengatur latar belakang halaman dengan gambar sembarang */
        body {
            background-image: url('https://picsum.photos/1200/800'); /* URL gambar background */
            background-size: cover;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Container putih transparan agar teks tetap mudah dibaca */
        .konten-utama {
            background-color: rgba(255, 255, 255, 0.9); 
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* Heading */
        h1 {
            color: #2980b9; /* Elemen warna pada teks */
            text-align: center;
        }

        /* Garis Berwarna */
        hr.garis-warna {
            border: none;
            height: 4px;
            background-color: #e74c3c; /* Warna merah pada garis */
            margin: 20px 0;
        }

        /* Gambar dengan garis tepi (border) */
        .gambar-tugas {
            display: block;
            margin: 20px auto;
            border: 6px solid #2c3e50; /* Garis tepi (border) pada gambar */
            border-radius: 10px; /* Opsional: Membuat sudut gambar sedikit melengkung */
        }
        
        p {
            text-align: center;
            font-size: 16px;
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="konten-utama">
        <!-- 1. Minimal Sebuah Heading -->
        <h1>Studi Kasus Halaman Web Sederhana</h1>

        <!-- 2. Garis Berwarna -->
        <hr class="garis-warna">

        <!-- 3. Elemen Teks -->
        <p>
            Halaman ini dibuat untuk memenuhi syarat studi kasus praktikum HTML. <br>
            Terdapat latar belakang (background) berupa gambar, judul (heading), garis pembatas yang diberi warna merah, dan sebuah gambar dengan garis tepi.
        </p>

        <!-- 4. Gambar dengan Garis Tepi (Border) -->
        <img src="https://picsum.photos/400/300" alt="Gambar Pemandangan" class="gambar-tugas">

    </div>

</body>
</html>
